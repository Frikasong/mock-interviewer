name: Release

# 打 tag 就发版：v1.0.0 这样的 tag 一推上来，自动构建 .skill 并建 Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build skills
        run: python3 build.py

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/interview-prep.skill
            dist/interview-prep-zh.skill
            portable/interview-prep.md
            portable/interview-prep-zh.md
            interviewer/index.html
          generate_release_notes: true
          body: |
            ## 下载哪个

            - **interview-prep.md** / **interview-prep-zh.md** — 通用单文件版：整份粘贴给任何 AI（ChatGPT、Gemini、Claude、DeepSeek、Kimi……）就能用。
            - **interview-prep.skill** / **interview-prep-zh.skill** — Claude.ai 上传用。其他能读 SKILL.md 的智能体（Codex、Gemini CLI、Copilot、Cursor……）用仓库里的 `./install.sh`。只装一个语言版本。
            - **MCP 服务器** — 不用下载，按 README 把 `uvx --from git+https://github.com/Frikasong/mock-interviewer mock-interviewer-mcp` 加进客户端配置。
            - **index.html** — Mock Interviewer。下载后用 Chrome 打开，没有安装步骤。
            安装和用法见 README。
