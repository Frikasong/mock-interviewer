<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Interviewer</title>
<style>
:root{
  --room:#14181b; --room2:#1d2327; --room3:#232b30;
  --line:#2e383f; --ink:#dce3e5; --muted:#8494a0; --faint:#5c6a73;
  --card:#f0ead9; --card-ink:#23282b; --card-edge:#d8cfb8;
  --ok:#5b9e90; --amber:#d89b4a; --alarm:#b8503c;
  --serif:Georgia,"Iowan Old Style","Songti SC","Noto Serif SC",serif;
  --sans:ui-sans-serif,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--room);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:none}
textarea,input,select{font:inherit;color:var(--ink);background:var(--room);border:1px solid var(--line);border-radius:2px;padding:8px 10px;width:100%}
textarea{font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.btn{border:1px solid var(--line);border-radius:2px;padding:9px 16px;background:var(--room2);transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ok);color:#0e1416;border-color:var(--ok);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.stop{background:var(--alarm);border-color:var(--alarm);color:#fff;font-weight:600}
.btn.ghost{border-color:transparent;color:var(--muted);padding:6px 8px}
.btn.ghost:hover{color:var(--ink)}
.btn[disabled]{opacity:.35;cursor:not-allowed}

/* ---- shell ---- */
.masthead{display:flex;align-items:baseline;gap:14px;padding:16px 26px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.wordmark{font-family:var(--serif);font-size:17px;letter-spacing:.01em}
.masthead .lbl{margin-left:auto}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.lang button{padding:3px 9px;font-size:12px;color:var(--faint)}
.lang button[aria-pressed=true]{background:var(--room3);color:var(--ink)}
.wrap{max-width:940px;margin:0 auto;padding:34px 26px 80px}

/* ---- setup ---- */
.lede{font-family:var(--serif);font-size:26px;line-height:1.35;margin:0 0 10px;max-width:24em}
.sub{color:var(--muted);max-width:44em;margin:0 0 30px}
.field{margin-bottom:22px}
.field>.lbl{display:block;margin-bottom:7px}
.hint{font-size:12.5px;color:var(--faint);margin-top:6px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row>*{flex:1 1 200px}
.scripts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:12px}
.script{border:1px solid var(--line);border-radius:2px;padding:11px 13px;text-align:left;background:var(--room2)}
.script:hover{border-color:var(--muted)}
.script[aria-pressed=true]{border-color:var(--ok);background:var(--room3)}
.script b{display:block;font-weight:600;font-size:13.5px;margin-bottom:2px}
.script span{font-size:12px;color:var(--faint)}
.toggles{display:flex;gap:20px;flex-wrap:wrap}
.tg{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--muted)}
.tg input{width:auto}
.err{color:var(--alarm);font-size:13px;margin-top:10px}
.notice{border-left:2px solid var(--line);padding:2px 0 2px 14px;color:var(--faint);font-size:12.5px;margin:26px 0}

/* ---- session ---- */
.stage{display:grid;grid-template-columns:150px minmax(0,1fr) 236px;gap:26px;align-items:start}
.rail{border-right:1px solid var(--line);padding-right:14px;min-height:300px}
.qitem{display:flex;gap:9px;padding:6px 0;font-size:12.5px;color:var(--faint);text-align:left;width:100%}
.qitem b{font-family:var(--mono);font-size:11px;padding-top:2px}
.qitem.done{color:var(--muted)}
.qitem.now{color:var(--ink)}
.qitem.now b{color:var(--ok)}
.qitem span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.cardwrap{position:relative}
.cue{height:20px;font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--amber);opacity:0;transition:opacity .5s;margin-bottom:9px}
.cue.on{opacity:1}
.card{background:var(--card);color:var(--card-ink);border-radius:3px;padding:34px 34px 30px;position:relative;overflow:hidden;
  box-shadow:0 26px 60px -30px rgba(0,0,0,.9),0 0 0 1px var(--card-edge) inset}
.card .kicker{font-family:var(--sans);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8a8471;margin-bottom:16px;display:flex;gap:12px}
.card .q{font-family:var(--serif);font-size:25px;line-height:1.4;margin:0}
.card .fact{font-family:var(--serif);font-size:15.5px;line-height:1.62;margin-top:18px;white-space:pre-wrap;border-top:1px solid var(--card-edge);padding-top:16px}
.bar{position:absolute;left:0;bottom:0;height:3px;width:0%;background:var(--ok);transition:width .12s linear,background .3s}
.bar.warn{background:var(--amber)}
.bar.over{background:var(--alarm)}

.deck{display:flex;align-items:center;gap:16px;margin-top:20px;flex-wrap:wrap}
.clock{font-family:var(--mono);font-size:31px;letter-spacing:.02em;min-width:104px}
.clock.warn{color:var(--amber)}
.clock.over{color:var(--alarm)}
.budget{font-family:var(--mono);font-size:12px;color:var(--faint)}
.deck .spacer{flex:1}

.panel{margin-top:26px;border-top:1px solid var(--line);padding-top:20px}
.checks{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px}
.prepbox{background:var(--room2);border:1px solid var(--line);border-radius:2px;padding:12px 14px;font-size:13px;margin-top:14px}
.prepbox .lbl{margin-bottom:6px;display:block}
.prepbox p{margin:0 0 5px}
.prepbox em{color:var(--muted);font-style:normal}

.aside{font-size:12.5px}
.cam{width:100%;aspect-ratio:4/3;background:var(--room2);border:1px solid var(--line);border-radius:2px;object-fit:cover}
video.cam{transform:scaleX(-1)}
.rec{display:flex;align-items:center;gap:7px;margin-top:8px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.dot.live{background:var(--alarm);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}
.tx{margin-top:16px}
.tx textarea{min-height:190px}
.interim{color:var(--faint)}

/* ---- debrief ---- */
.score{width:100%;border-collapse:collapse;font-size:13px;margin:18px 0}
.score th,.score td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.score th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:400}
.score td.num{font-family:var(--mono);white-space:nowrap}
.score .over{color:var(--alarm)}
.dl{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.vid{margin-top:10px;display:flex;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}

@media (max-width:860px){
  .stage{grid-template-columns:1fr;gap:20px}
  .rail{border-right:none;border-bottom:1px solid var(--line);padding:0 0 12px}
  .card .q{font-size:21px}
  .wrap{padding:24px 18px 60px}
}
</style>
</head>
<body>
<header class="masthead">
  <span class="wordmark">Mock Interviewer</span>
  <span class="lbl" id="mh-priv"></span>
  <div class="lang">

let LANG = (navigator.language||"en").toLowerCase().startsWith("zh") ? "zh" : "en";
const t = k => T[LANG][k] ?? k;

/* ======================= built-in scripts ======================= */
const SCRIPTS = {

- watch: end on them, not on you

- type: motivation
- budget: 90s

- budget: 90s

/* ======================= question parsing ======================= */
function parseBudget(v){
  if(!v) return null;
  const s=String(v).trim().toLowerCase();
  let m=s.match(/^(\d+(?:\.\d+)?)\s*m/); if(m) return Math.round(parseFloat(m[1])*60);
  m=s.match(/^(\d+)\s*s?$/); if(m) return parseInt(m[1],10);
  return null;
}
const FIELDMAP={type:"type",budget:"budget",reading:"reading",mode:"type",
  "best story":"best","beststory":"best","最优素材":"best","素材":"best",
  backup:"backup","次优":"backup",opener:"opener","开场句":"opener","开头一句":"opener",
  watch:"watch","注意":"watch",framework:"watch","框架":"watch",
  fact:"fact","factpattern":"fact","fact pattern":"fact","题面":"fact",
  key:"key","answer key":"key","answerkey":"key","参考答案":"key",
  source:"source","来源":"source"};
function parseBank(md){
  const out=[]; let cur=null, lastField=null;
  for(const raw of (md||"").split(/\r?\n/)){
    const h=raw.match(/^###\s*(.*?)\s*$/);
    if(h){
      if(cur) out.push(cur);
      cur = h[1] ? {text:h[1],fields:{}} : null;   // an empty "###" is a blank template slot: close, don't collect
      lastField=null; continue;
    }
    if(!cur) continue;
    const f=raw.match(/^\s*[-*]\s*([^:：]{1,24})[:：]\s*(.*)$/);
    if(f){
      const key=FIELDMAP[f[1].trim().toLowerCase()]||null;
      lastField=key;
      if(key) cur.fields[key]=(f[2]||"").trim();
      continue;
    }
    if(lastField && /^\s{2,}\S/.test(raw)){
      cur.fields[lastField]=((cur.fields[lastField]||"")+"\n"+raw.trim()).trim();
    }
  }
  if(cur) out.push(cur);
  return out.map((q,i)=>({
    n:i+1, text:q.text,
    type:q.fields.type||"",
    isCase:/case|fact|笔试|案例/i.test(q.fields.type||"")||!!q.fields.fact,
    budget:parseBudget(q.fields.budget)|| (q.fields.fact?600:120),
    reading:parseBudget(q.fields.reading)||(q.fields.fact?600:0),
    best:q.fields.best||"", backup:q.fields.backup||"",
    opener:q.fields.opener||"", watch:q.fields.watch||"",
    fact:q.fields.fact||"", key:q.fields.key||"", source:q.fields.source||""
  }));
}

/* ============================ state ============================ */
const S={
  org:"",role:"",bankMd:"",prep:"",script:"panel",

  qs:[],i:0,answers:{},
  phase:"setup", // setup | reading | answering | marking | debrief
  t0:0,elapsed:0,tick:null,cueOn:false,
  stream:null,rec:null,chunks:[],clips:{},recog:null,interim:"",
  camReady:false
};
const $=s=>document.querySelector(s);
const app=$("#app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss=s=>{const m=Math.floor(Math.abs(s)/60),x=Math.floor(Math.abs(s)%60);return (s<0?"-":"")+m+":"+String(x).padStart(2,"0")};

function save(){
  try{ localStorage.setItem("mis.draft",JSON.stringify({org:S.org,role:S.role,bankMd:S.bankMd,prep:S.prep,answers:S.answers})); }catch(e){}
}
function loadDraft(){
  try{ const d=JSON.parse(localStorage.getItem("mis.draft")||"null"); if(d){S.org=d.org||"";S.role=d.role||"";S.bankMd=d.bankMd||"";S.prep=d.prep||"";} }catch(e){}
}

/* ============================ setup ============================ */
function renderSetup(){
  const cards=Object.entries(SCRIPTS).map(([k,v])=>{
    const[n,d]=v[LANG];
    return `<button class="script" data-script="${k}" aria-pressed="${S.script===k}"><b>${esc(n)}</b><span>${esc(d)}</span></button>`;
  }).join("");
  app.innerHTML=`
   <h1 class="lede">${esc(t("lede"))}</h1>
   <p class="sub">${esc(t("sub"))}</p>

   <div class="field row">
     <div><span class="lbl">${esc(t("org"))}</span>
       <input id="f-org" value="${esc(S.org)}" placeholder="${esc(t("orgPh"))}"></div>
     <div><span class="lbl">${esc(t("role"))}</span>
       <input id="f-role" value="${esc(S.role)}" placeholder="${esc(t("rolePh"))}"></div>
   </div>

   <div class="field">
     <span class="lbl">${esc(t("script"))}</span>
     <div class="scripts">${cards}</div>
     <div class="hint">${t("scriptHint")}</div>
   </div>

   <div class="field">
     <span class="lbl">${esc(t("bank"))}</span>
     <textarea id="f-bank" rows="9" placeholder="${esc(t("bankPh"))}">${esc(S.bankMd)}</textarea>
     <div class="hint"><label class="btn ghost" style="display:inline-block">${esc(t("upload"))}
       <input type="file" id="f-file" accept=".md,.txt,.markdown" style="display:none"></label>
       <span id="qcount"></span></div>
   </div>

   <div class="field">
     <span class="lbl">${esc(t("prep"))}</span>
     <textarea id="f-prep" rows="5" placeholder="${esc(t("prepPh"))}">${esc(S.prep)}</textarea>
     <div class="hint">${esc(t("prepHint"))}</div>
   </div>

   <div class="field">
     <span class="lbl">${esc(t("opts"))}</span>
     <div class="toggles">
       <label class="tg"><input type="checkbox" id="o-cam" ${S.opts.cam?"checked":""}> ${esc(t("cam"))}</label>
       <label class="tg"><input type="checkbox" id="o-mic" ${S.opts.mic?"checked":""}> ${esc(t("mic"))}</label>
       <label class="tg"><input type="checkbox" id="o-speak" ${S.opts.speak?"checked":""}> ${esc(t("speak"))}</label>
     </div>
   </div>

   <button class="btn primary" id="go">${esc(t("begin"))}</button>
   <div class="err" id="err"></div>

   <div class="notice">${esc(t("privacy"))}<br>${esc(t("chrome"))}</div>`;

  const sync=()=>{S.org=$("#f-org").value;S.role=$("#f-role").value;S.bankMd=$("#f-bank").value;S.prep=$("#f-prep").value;
    const n=parseBank(S.bankMd).length; $("#qcount").textContent = n? "  · "+n+(LANG==="zh"?" 题":" questions") : ""; save();};
  ["f-org","f-role","f-bank","f-prep"].forEach(id=>$("#"+id).addEventListener("input",sync));
  document.querySelectorAll("[data-script]").forEach(b=>b.addEventListener("click",()=>{
    S.script=b.dataset.script;
    const md=SCRIPTS[S.script].md.trim();
    if(md) S.bankMd=md;
    renderSetup();
  }));
  $("#f-file").addEventListener("change",e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{S.bankMd=r.result;renderSetup();}; r.readAsText(f);
  });
  ["cam","mic","speak"].forEach(k=>$("#o-"+k).addEventListener("change",e=>S.opts[k]=e.target.checked));
  $("#go").addEventListener("click",start);
  sync();
}

/* ========================= media plumbing ========================= */
async function initMedia(){
  if(!S.opts.cam && !S.opts.mic) return;
  try{
    S.stream=await navigator.mediaDevices.getUserMedia({video:S.opts.cam,audio:true});
    S.camReady=true;
  }catch(e){ S.camReady=false; }
}
function startClip(){
  if(!S.stream) return;
  try{
    S.chunks=[];
    S.rec=new MediaRecorder(S.stream);
    S.rec.ondataavailable=e=>{ if(e.data&&e.data.size) S.chunks.push(e.data); };
    S.rec.onstop=()=>{
      if(!S.chunks.length) return;
      const b=new Blob(S.chunks,{type:S.chunks[0].type||"video/webm"});
      S.clips[S.qs[S.i].n]={url:URL.createObjectURL(b),size:b.size};
      render();
    };
    S.rec.start();
  }catch(e){}
}
function stopClip(){ try{ if(S.rec&&S.rec.state!=="inactive") S.rec.stop(); }catch(e){} S.rec=null; }

function startRecog(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR||!S.opts.mic) return;
  try{
    const r=new SR();
    r.continuous=true; r.interimResults=true;
    r.lang=/[\u4e00-\u9fa5]/.test(S.qs[S.i].text)?"zh-CN":"en-US";
    r.onresult=e=>{
      let fin="",itr="";
      for(let k=e.resultIndex;k<e.results.length;k++){
        const r0=e.results[k];
        if(r0.isFinal) fin+=r0[0].transcript; else itr+=r0[0].transcript;
      }
      if(fin){ const a=ans(); a.transcript=(a.transcript?a.transcript+" ":"")+fin.trim(); }
      S.interim=itr;
      const ta=$("#tx"); if(ta&&document.activeElement!==ta) ta.value=ans().transcript+(itr?" "+itr:"");
    };
    r.onerror=()=>{};
    r.onend=()=>{ if(S.phase==="answering"){ try{r.start()}catch(e){} } };
    r.start(); S.recog=r;
  }catch(e){}
}
function stopRecog(){ try{ if(S.recog){S.recog.onend=null;S.recog.stop();} }catch(e){} S.recog=null; S.interim=""; }

function speak(text){
  if(!S.opts.speak||!window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=/[\u4e00-\u9fa5]/.test(text)?"zh-CN":"en-US";
    u.rate=.98;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ========================== session flow ========================== */
function ans(){
  const n=S.qs[S.i].n;
  if(!S.answers[n]) S.answers[n]={elapsed:0,transcript:"",c1:false,c2:false,c3:false,note:"",skipped:false};
  return S.answers[n];
}
async function start(){
  S.qs=parseBank(S.bankMd);
  if(!S.qs.length){ $("#err").textContent=t("noq"); return; }
  S.i=0; S.answers={}; S.clips={};
  await initMedia();
  enterQuestion();
}
function enterQuestion(){
  const q=S.qs[S.i];
  S.elapsed=0; S.cueOn=false;
  S.phase = q.isCase ? "reading" : "reading";
  render();
  speak(q.text);
  if(q.isCase && q.reading) beginTimer(q.reading,true);
}
function beginTimer(){
  clearInterval(S.tick);
  S.t0=Date.now();
  S.tick=setInterval(()=>{
    S.elapsed=(Date.now()-S.t0)/1000;
    if(S.phase==="answering"){
      const on=S.elapsed<15;
      if(on!==S.cueOn){ S.cueOn=on; const c=$(".cue"); if(c) c.classList.toggle("on",on); }
    }
    paintClock();
  },100);
}
function beginAnswer(){
  S.phase="answering"; S.elapsed=0; S.cueOn=true;
  render(); beginTimer(); startClip(); startRecog();
}
function endAnswer(skipped){
  clearInterval(S.tick); stopClip(); stopRecog();
  try{speechSynthesis.cancel()}catch(e){}
  const a=ans(); a.elapsed=Math.round(S.elapsed); a.skipped=!!skipped;
  S.phase="marking"; render(); save();
}
function nextQuestion(){
  if(S.i>=S.qs.length-1){ finish(); return; }
  S.i++; enterQuestion();
}
function finish(){
  clearInterval(S.tick); stopClip(); stopRecog();
  if(S.stream){ S.stream.getTracks().forEach(x=>x.stop()); S.stream=null; }
  S.phase="debrief"; render(); save();
}
function paintClock(){
  const q=S.qs[S.i]; const el=$(".clock"), bar=$(".bar");
  if(!el||!q) return;
  const budget = S.phase==="reading"&&q.isCase ? q.reading : q.budget;
  const left = budget - S.elapsed;
  el.textContent = budget? mmss(Math.ceil(left)) : mmss(Math.floor(S.elapsed));
  const pct = budget? Math.min(100,(S.elapsed/budget)*100) : 0;
  const warn = budget && S.elapsed>budget*.75 && S.elapsed<=budget;
  const over = budget && S.elapsed>budget;
  el.classList.toggle("warn",!!warn); el.classList.toggle("over",!!over);
  if(bar){ bar.style.width=pct+"%"; bar.classList.toggle("warn",!!warn); bar.classList.toggle("over",!!over); }
}

/* ============================ render ============================ */
function render(){
  if(S.phase==="setup") return renderSetup();
  if(S.phase==="debrief") return renderDebrief();
  const q=S.qs[S.i], a=ans();
  const rail=S.qs.map((x,k)=>`<button class="qitem ${k<S.i?"done":""} ${k===S.i?"now":""}" data-jump="${k}">
      <b>${String(x.n).padStart(2,"0")}</b><span>${esc(x.text)}</span></button>`).join("");

  const budget = (S.phase==="reading"&&q.isCase)? q.reading : q.budget;
  const prepared = (q.opener||q.best||q.watch)
    ? `${q.opener?`<p><em>${esc(t("pOpener"))}:</em> ${esc(q.opener)}</p>`:""}
       ${q.best?`<p><em>${esc(t("pStory"))}:</em> ${esc(q.best)}${q.backup?" / "+esc(q.backup):""}</p>`:""}
       ${q.watch?`<p><em>${esc(t("pWatch"))}:</em> ${esc(q.watch)}</p>`:""}`
    : `<p><em>${esc(t("pNone"))}</em></p>`;

  let deck="";
  if(S.phase==="reading"){
    deck=`<button class="btn primary" id="b-start">${esc(q.isCase?t("startCase"):t("startAns"))}</button>
          <button class="btn ghost" id="b-replay">${esc(t("replay"))}</button>`;
  }else if(S.phase==="answering"){
    deck=`<button class="btn stop" id="b-done">${esc(t("done"))}</button>
          <button class="btn ghost" id="b-skip">${esc(t("skip"))}</button>`;
  }else{
    deck=`<button class="btn primary" id="b-next">${esc(S.i>=S.qs.length-1?t("finish"):t("next"))}</button>`;
  }

  app.innerHTML=`<div class="stage">
    <nav class="rail">${rail}</nav>
    <section class="cardwrap">
      <div class="cue ${S.cueOn&&S.phase==="answering"?"on":""}">${esc(t("lead"))}</div>
      <article class="card">
        <div class="kicker"><span>${esc(t("qof").replace("{a}",q.n).replace("{b}",S.qs.length))}</span>
          ${q.type?`<span>${esc(q.type)}</span>`:""}
          <span>${budget?esc(t(S.phase==="reading"&&q.isCase?"reading":"budget"))+" "+mmss(budget):esc(t("noBudget"))}</span></div>
        <p class="q">${esc(q.text)}</p>
        ${q.fact&&(S.phase==="reading"||q.isCase)?`<div class="fact">${esc(q.fact)}</div>`:""}
        <div class="bar"></div>
      </article>
      <div class="deck">
        <span class="clock">${budget?mmss(budget):"0:00"}</span>
        ${deck}
      </div>

      ${S.phase==="marking"?`<div class="panel">
        <span class="lbl">${esc(t("checks"))}</span>
        <div class="checks" style="margin-top:8px">
          <label class="tg"><input type="checkbox" id="c1" ${a.c1?"checked":""}> ${esc(t("c1"))}</label>
          <label class="tg"><input type="checkbox" id="c2" ${a.c2?"checked":""}> ${esc(t("c2"))}</label>
          <label class="tg"><input type="checkbox" id="c3" ${a.c3?"checked":""}> ${esc(t("c3"))}</label>
        </div>
        <span class="lbl">${esc(t("note"))}</span>
        <textarea id="note" rows="3" placeholder="${esc(t("notePh"))}" style="margin-top:6px">${esc(a.note)}</textarea>
        ${S.clips[q.n]?`<div class="vid">${esc(t("vidFor"))} · <a href="${S.clips[q.n].url}" download="Q${String(q.n).padStart(2,"0")}.webm" style="color:var(--ok)">${(S.clips[q.n].size/1e6).toFixed(1)} MB</a></div>`:""}
      </div>`:`<div class="prepbox"><span class="lbl">${esc(t("prepared"))}</span>${prepared}</div>`}
    </section>

    <aside class="aside">
      ${S.opts.cam?`<video class="cam" id="cam" autoplay muted playsinline></video>`:`<div class="cam" style="display:grid;place-items:center;color:var(--faint);font-size:12px">${esc(t("off"))}</div>`}
      <div class="rec"><span class="dot ${S.phase==="answering"?"live":""}"></span>${esc(S.phase==="answering"?t("rec"):t("idle"))}</div>
      <div class="tx">
        <span class="lbl">${esc(t("transcript"))}</span>
        <textarea id="tx" rows="9" style="margin-top:6px">${esc(a.transcript)}</textarea>
        <div class="hint">${esc(t("txHint"))}</div>
      </div>
    </aside>
  </div>`;

  if(S.opts.cam&&S.stream){ const v=$("#cam"); if(v) v.srcObject=S.stream; }
  document.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{
    if(S.phase==="answering") return;
    S.i=+b.dataset.jump; enterQuestion();
  }));
  const on=(id,ev,fn)=>{const e=$("#"+id); if(e) e.addEventListener(ev,fn);};
  on("b-start","click",beginAnswer);
  on("b-replay","click",()=>speak(q.text));
  on("b-done","click",()=>endAnswer(false));
  on("b-skip","click",()=>endAnswer(true));
  on("b-next","click",nextQuestion);
  on("tx","input",e=>{ans().transcript=e.target.value;save();});
  on("note","input",e=>{ans().note=e.target.value;save();});
  ["c1","c2","c3"].forEach(c=>on(c,"change",e=>{ans()[c]=e.target.checked;save();}));
  paintClock();
}

/* =========================== debrief =========================== */
function wc(s){ const z=(s||"").trim(); if(!z) return 0;
  return /[\u4e00-\u9fa5]/.test(z) ? z.replace(/\s/g,"").length : z.split(/\s+/).length; }

function buildMarkdown(){
  const L=LANG==="zh";
  const head=[];
  head.push(`# ${L?"模拟面试复盘":"Mock interview debrief"} — ${S.org||"—"}${S.role?" · "+S.role:""}`);
  head.push(`${L?"日期":"Date"}: ${new Date().toISOString().slice(0,10)}`);
  head.push("");
  head.push(`## ${t("coachTitle")}`);
  head.push("```");
  head.push(L
   ? `你是我的面试教练。下面是一场模拟面试的完整记录：每题的题面、我准备好的素材、我实际说的话、用时对预算、以及我的自评。请逐题给我：
1) 开头 15 秒有没有给结论；
2) STAR 完整度，最常丢的 Result 有没有丢；
3) 用时对预算——超了该砍哪一段，不足该补什么；
4) 我准备的素材和我实际说出口的差在哪（这一条最重要，请具体指出我丢了哪个准备好的点）。
每题给 1-5 分和一句可以直接照念的更好开头。最后列出最该重练的 3 题，以及需要新写或修订的故事卡。不要泛泛鼓励，要具体到可执行。`
   : `You are my interview coach. Below is a full record of one mock interview: each question, the material I had prepared, what I actually said, time against budget, and my own marks. For each question tell me:
1) whether I gave a conclusion in the first 15 seconds;
2) STAR completeness, especially whether the Result went missing;
3) time against budget — what to cut if I ran over, what to add if I ran short;
4) the gap between what I prepared and what I actually said (this one matters most — name the prepared point I dropped).
Score each answer 1-5 and give one better opening line I could say verbatim. Finish with the three questions to re-run first and any story cards to write or revise. Be specific and actionable rather than encouraging.`);
  head.push("```");
  head.push("");

  if(S.prep.trim()){
    head.push(`## ${L?"我准备的材料":"Material I prepared"}`);
    head.push(S.prep.trim());
    head.push("");
  }

  const rows=[];
  let total=0;
  S.qs.forEach(q=>{
    const a=S.answers[q.n]; if(!a) return;
    total+=a.elapsed||0;
    rows.push(`### Q${String(q.n).padStart(2,"0")} — ${q.text}`);
    rows.push(`- ${L?"类型":"type"}: ${q.type||"—"}`);
    rows.push(`- ${L?"用时/预算":"time / budget"}: ${mmss(a.elapsed)} / ${mmss(q.budget)}${a.elapsed>q.budget?` (${t("over")} ${mmss(a.elapsed-q.budget)})`:""}`);
    rows.push(`- ${L?"自评":"self-marks"}: ${t("c1")}=${a.c1?"Y":"N"} · ${t("c2")}=${a.c2?"Y":"N"} · ${t("c3")}=${a.c3?"Y":"N"}${a.skipped?" · SKIPPED":""}`);
    if(q.opener||q.best||q.watch){
      rows.push(`- ${L?"我准备的":"what I prepared"}: ${[q.opener&&`${t("pOpener")}: ${q.opener}`,q.best&&`${t("pStory")}: ${q.best}`,q.watch&&`${t("pWatch")}: ${q.watch}`].filter(Boolean).join(" | ")}`);
    } else {
      rows.push(`- ${L?"我准备的":"what I prepared"}: —`);
    }
    if(q.key) rows.push(`- ${L?"参考答案":"answer key"}: ${q.key.replace(/\n/g," ")}`);
    rows.push("");
    rows.push(`**${L?"我实际说的":"What I actually said"}**`);
    rows.push("");
    rows.push(a.transcript.trim()||`_(${L?"无转录":"no transcript"})_`);
    rows.push("");
    if(a.note.trim()){ rows.push(`**${t("note")}**: ${a.note.trim()}`); rows.push(""); }
  });

  return head.join("\n")+`## ${L?"逐题记录":"Question by question"}\n\n`+rows.join("\n")
    +`\n---\n${t("total")}: ${mmss(total)}\n`;
}

function renderDebrief(){
  const L=LANG==="zh";
  let total=0;
  const rows=S.qs.map(q=>{
    const a=S.answers[q.n]; if(!a) return "";
    total+=a.elapsed||0;
    const over=a.elapsed>q.budget;
    return `<tr>
      <td>${esc(q.text)}</td>
      <td class="num ${over?"over":""}">${mmss(a.elapsed)}</td>
      <td class="num">${mmss(q.budget)}</td>
      <td class="num">${a.c1?"✓":"·"} ${a.c2?"✓":"·"} ${a.c3?"✓":"·"}</td>
      <td class="num">${wc(a.transcript)}</td></tr>`;
  }).join("");
  const clips=Object.entries(S.clips).map(([n,c])=>
    `<a class="btn" href="${c.url}" download="Q${String(n).padStart(2,"0")}.webm">Q${String(n).padStart(2,"0")} · ${(c.size/1e6).toFixed(1)} MB</a>`).join("");

  app.innerHTML=`
    <h1 class="lede">${esc(t("debrief"))}${S.org?" — "+esc(S.org):""}</h1>
    <p class="sub">${esc(t("dsub"))}</p>
    <table class="score">
      <thead><tr><th>${esc(t("tq"))}</th><th>${esc(t("tt"))}</th><th>${esc(t("tb"))}</th><th>${esc(t("tf"))}</th><th>${esc(t("ttx"))}</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <p class="budget">${esc(t("total"))}: ${mmss(total)}</p>
    <div class="dl">
      <button class="btn primary" id="dl-md">${esc(t("exportMd"))}</button>
      <button class="btn" id="again">${esc(t("again"))}</button>
    </div>
    ${clips?`<div class="field" style="margin-top:26px"><span class="lbl">${esc(t("exportAll"))}</span><div class="dl">${clips}</div></div>`:""}
    <div class="notice">${esc(t("privacy"))}</div>`;

  $("#dl-md").addEventListener("click",()=>{
    const blob=new Blob([buildMarkdown()],{type:"text/markdown"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`debrief-${(S.org||"session").replace(/[^\w\u4e00-\u9fa5-]+/g,"-").toLowerCase()}-${new Date().toISOString().slice(0,10)}.md`;
    a.click();
  });
  $("#again").addEventListener("click",()=>{ S.phase="setup"; S.answers={}; S.clips={}; render(); });
}

/* ============================ boot ============================ */
function setLang(l){
  LANG=l; document.documentElement.lang=l==="zh"?"zh":"en";
  $("#lang-en").setAttribute("aria-pressed",String(l==="en"));
  $("#lang-zh").setAttribute("aria-pressed",String(l==="zh"));
  $("#mh-priv").textContent=t("priv");
  render();
}
$("#lang-en").addEventListener("click",()=>setLang("en"));
$("#lang-zh").addEventListener("click",()=>setLang("zh"));
window.addEventListener("beforeunload",e=>{ if(S.phase!=="setup"){e.preventDefault();e.returnValue="";} });
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="TEXTAREA"||e.target.tagName==="INPUT") return;
  if(e.code==="Space"){ e.preventDefault();
    if(S.phase==="reading") beginAnswer();
    else if(S.phase==="answering") endAnswer(false);
    else if(S.phase==="marking") nextQuestion(); }
});
loadDraft();
if(!S.bankMd) S.bankMd=SCRIPTS.panel.md.trim();
setLang(LANG);
</script>
