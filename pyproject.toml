[project]
name = "mock-interviewer-mcp"
version = "1.1.0"
description = "Interview prep in three steps, served over MCP to any AI client: research the employer, research yourself, practise and fold the debrief back in."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.9"]

[project.urls]
Homepage = "https://github.com/Frikasong/mock-interviewer"

[project.scripts]
mock-interviewer-mcp = "mock_interviewer_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_interviewer_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "mock_interviewer_mcp/skills"
